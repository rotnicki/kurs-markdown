<!doctype html>
<html lang="{{ site.lang | default: 'pl-PL' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title }} | {{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <style>
    :root {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.65;
      color-scheme: light dark;
    }
    body {
      margin: 0;
      padding: 0;
    }
    a {
      text-decoration-thickness: 0.12em;
      text-underline-offset: 0.15em;
    }
    a:focus, button:focus, [tabindex]:focus {
      outline: 3px solid currentColor;
      outline-offset: 3px;
    }
    .skip-link {
      position: absolute;
      left: -10000px;
      top: 0;
      padding: 0.75rem;
      background: Canvas;
      color: CanvasText;
      z-index: 1000;
    }
    .skip-link:focus {
      left: 0.5rem;
      top: 0.5rem;
    }
    header, footer, main {
      max-width: 72ch;
      margin-inline: auto;
      padding-inline: 1rem;
    }
    header {
      padding-block: 1.25rem 0.5rem;
      border-bottom: 1px solid;
    }
    main {
      padding-block: 1.5rem 3rem;
    }
    footer {
      padding-block: 1rem 2rem;
      border-top: 1px solid;
    }
    .site-title {
      font-size: 1.25rem;
      font-weight: 700;
      margin: 0;
    }
    h1, h2, h3 {
      line-height: 1.25;
      margin-top: 1.6em;
    }
    h1 {
      margin-top: 0;
    }
    pre {
      overflow-x: auto;
      padding: 1rem;
      border: 1px solid;
      border-radius: 0.3rem;
    }
    code {
      font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
    }
    blockquote {
      margin-inline: 0;
      padding-left: 1rem;
      border-left: 0.3rem solid;
    }
    .lesson-nav {
      margin-top: 2.5rem;
      padding-top: 1rem;
      border-top: 1px solid;
    }
    .lesson-nav ul {
      padding-left: 1.25rem;
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#tresc">Przejdź do treści</a>
  <header>
    <p class="site-title"><a href="{{ '/' | relative_url }}">{{ site.title }}</a></p>
  </header>
  <main id="tresc" tabindex="-1">
    <h1>{{ page.title }}</h1>
    {{ content }}
  </main>
  <footer>
    <p>Kurs przygotowany w zwykłych plikach Markdown i opublikowany jako dostępna strona HTML.</p>
  </footer>
</body>
</html>
