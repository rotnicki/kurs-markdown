<!doctype html>
<html lang="{{ site.lang | default: 'pl-PL' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title }} | {{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
</head>
<body>
  <header>
    <p><a href="{{ '/' | relative_url }}">{{ site.title }}</a></p>
  </header>
  <main id="tresc">
    <h1>{{ page.title }}</h1>
    {{ content }}
  </main>
  <footer>
    <p>Kurs przygotowany w zwykłych plikach Markdown i opublikowany jako strona HTML.</p>
  </footer>
</body>
</html>
